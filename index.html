<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADT Print — CRM</title>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&family=Unbounded:wght@500;600;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Onest',system-ui,sans-serif;background:#EDEBE6;color:#22262A;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#C7C2B8;border-radius:8px}
::-webkit-scrollbar-track{background:transparent}

.app{display:flex;min-height:100vh}

/* ===== SIDEBAR ===== */
.sidebar{width:248px;flex:none;background:#181B1D;color:#EDEBE6;display:flex;flex-direction:column;padding:22px 14px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:6px 10px 26px}
.brand-mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#C9A15E,#8A6E3B);display:flex;align-items:center;justify-content:center;font-family:'Unbounded',sans-serif;font-weight:700;font-size:15px;color:#181B1D;flex:none}
.brand-txt b{font-family:'Unbounded',sans-serif;font-size:15px;font-weight:600;display:block;letter-spacing:-.01em}
.brand-txt span{font-size:11px;color:#8B8F92;letter-spacing:.03em;text-transform:uppercase}

.nav{display:flex;flex-direction:column;gap:2px;flex:1}
.nav-sec{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:#63676A;padding:16px 12px 6px}
.nav-item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:9px;background:transparent;border:0;color:#B9BCBE;font-size:14px;font-weight:500;cursor:pointer;text-align:left;width:100%}
.nav-item:hover{background:#232629;color:#fff}
.nav-item.on{background:#2A2E31;color:#fff}
.nav-item .ic{width:18px;height:18px;flex:none;opacity:.9}
.nav-item .n{margin-left:auto;background:#C9A15E;color:#181B1D;font-size:11px;font-weight:700;border-radius:20px;padding:1px 7px}

.sidebar-foot{padding:12px;border-top:1px solid #2A2E31;margin-top:8px;display:flex;align-items:center;gap:10px}
.avatar{width:32px;height:32px;border-radius:8px;background:#2A2E31;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:none}
.sidebar-foot .who b{font-size:13px;display:block}
.sidebar-foot .who span{font-size:11px;color:#8B8F92}

/* ===== MAIN ===== */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{background:#F6F5F2;border-bottom:1px solid #DEDAD1;padding:18px 32px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:10}
.page-title{font-family:'Unbounded',sans-serif;font-weight:600;font-size:19px;letter-spacing:-.01em}
.topbar .sp{flex:1}
.search{width:280px;padding:10px 14px;border:1px solid #DEDAD1;border-radius:9px;background:#fff;font-size:13.5px}
.search:focus{outline:none;border-color:#181B1D}
.btn{border:1px solid #181B1D;background:transparent;color:#181B1D;border-radius:9px;padding:10px 16px;font-weight:600;font-size:13.5px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.btn.gold{background:linear-gradient(135deg,#C9A15E,#B8862B);border-color:transparent;color:#181B1D}
.btn.gold:hover{filter:brightness(1.06)}
.btn.ghost{border-color:#DEDAD1;color:#5B5F60}
.btn:disabled{opacity:.4;cursor:default}

.content{padding:28px 32px 90px;max-width:1280px;width:100%;margin:0 auto}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:28px}
.stat-card{background:#fff;border:1px solid #E4E1D9;border-radius:14px;padding:18px 20px}
.stat-card .lbl{font-size:12px;color:#8B8B84;font-weight:500;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.stat-card .val{font-family:'Unbounded',sans-serif;font-size:26px;font-weight:600;letter-spacing:-.02em}
.stat-card .sub{font-size:12px;color:#9A9A93;margin-top:4px}
.stat-card .sub.up{color:#3E7A4E}
.dot{width:8px;height:8px;border-radius:2px}

/* Filters row */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;align-items:center}
.chip{border:1px solid #DEDAD1;background:#fff;border-radius:999px;padding:7px 14px;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;font-weight:500;color:#4C4F50}
.chip.on{background:#181B1D;border-color:#181B1D;color:#fff}
.chip .d{width:8px;height:8px;border-radius:2px;flex:none}

/* Table-ish list */
.leads-table{background:#fff;border:1px solid #E4E1D9;border-radius:16px;overflow:hidden}
.lt-head{display:grid;grid-template-columns:3px 1.6fr 1fr 1fr .9fr .8fr;gap:14px;padding:13px 20px;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:#9A9A93;font-weight:600;border-bottom:1px solid #EEECE5;background:#FAF9F6}
.lt-row{display:grid;grid-template-columns:3px 1.6fr 1fr 1fr .9fr .8fr;gap:14px;align-items:center;padding:15px 20px;border-bottom:1px solid #EEECE5;cursor:pointer;transition:background .12s}
.lt-row:last-child{border-bottom:0}
.lt-row:hover{background:#FAF9F6}
.lt-bar{width:3px;height:34px;border-radius:2px}
.lt-name{font-weight:600;font-size:14.5px}
.lt-phone{font-size:12.5px;color:#9A9A93;margin-top:2px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:#5B5F60;font-weight:500}
.pill .sw{width:7px;height:7px;border-radius:50%;flex:none}
.src-badge{display:inline-flex;align-items:center;gap:5px;background:#F1EFE9;border-radius:6px;padding:3px 8px;font-size:11.5px;font-weight:600;color:#4C4F50}
.budget{font-weight:600;font-size:13.5px}
.timeago{font-size:12px;color:#9A9A93;text-align:right}

.empty{text-align:center;padding:70px 32px;background:#fff;border-radius:16px;border:1px solid #E4E1D9}
.empty h2{font-family:'Unbounded',sans-serif;font-size:20px;margin-bottom:10px}
.empty p{color:#8B8B84;margin-bottom:22px;font-size:14px}

/* Drawer */
.overlay{position:fixed;inset:0;background:rgba(24,27,29,.45);display:flex;justify-content:flex-end;z-index:100}
.drawer{width:100%;max-width:520px;height:100%;background:#F6F5F2;overflow-y:auto;animation:sl .22s ease-out}
@keyframes sl{from{transform:translateX(26px);opacity:.5}to{transform:none;opacity:1}}
.d-head{position:sticky;top:0;background:#F6F5F2;border-bottom:1px solid #E4E1D9;padding:20px 26px;display:flex;justify-content:space-between;align-items:center;z-index:2}
.d-head h2{font-family:'Unbounded',sans-serif;font-size:18px;font-weight:600}
.d-close{border:0;background:#fff;width:32px;height:32px;border-radius:8px;cursor:pointer;font-size:16px;color:#5B5F60;border:1px solid #E4E1D9}
.d-body{padding:24px 26px 60px}
.sec{background:#fff;border:1px solid #E4E1D9;border-radius:14px;padding:18px 20px;margin-bottom:16px}
.sec h3{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:#9A9A93;font-weight:700;margin-bottom:14px}

.stage-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.stage-btn{border:1.5px solid #E4E1D9;background:#fff;border-radius:9px;padding:11px 6px;font-size:11.5px;font-weight:600;text-align:center;cursor:pointer;color:#5B5F60}
.stage-btn.on{background:#181B1D;border-color:#181B1D;color:#fff}

.fld{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.fld:last-child{margin-bottom:0}
.fld>span{font-size:12px;color:#8B8B84;font-weight:600}
.fld input,.fld select,.fld textarea{padding:10px 13px;border:1px solid #E4E1D9;border-radius:9px;background:#FAF9F6;font-size:14px}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:#181B1D;background:#fff}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.link-del{border:0;background:none;color:#B23A22;font-size:13px;font-weight:600;cursor:pointer;padding:0;margin-top:6px}

.fab{position:fixed;right:32px;bottom:32px;background:linear-gradient(135deg,#C9A15E,#B8862B);color:#181B1D;border:0;border-radius:14px;padding:15px 22px;font-weight:700;font-size:14.5px;cursor:pointer;box-shadow:0 10px 28px rgba(184,134,43,.35);z-index:50}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#181B1D;color:#fff;padding:12px 20px;border-radius:10px;font-size:14px;z-index:300}

@media(max-width:900px){
  .sidebar{display:none}
  .stats{grid-template-columns:repeat(2,1fr)}
  .lt-head{display:none}
  .lt-row{grid-template-columns:3px 1fr;grid-template-areas:"bar main";padding:14px 16px}
  .lt-row>.pill,.lt-row>.src-badge,.lt-row>.budget,.lt-row>.timeago{display:none}
  .content{padding:20px 16px 90px}
  .topbar{padding:14px 16px}
  .search{width:140px}
}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useMemo } = React;

const SUPABASE_URL = "https://schuvtwhwzvtczrvlncj.supabase.co";
const SUPABASE_KEY = "sb_publishable_As95AsUHcyTa5LBk_zzMVQ_RsqJwv3C";

const supabase = {
  async fetch(method, table, { eq=null, select="*", data=null } = {}) {
    let url = `${SUPABASE_URL}/rest/v1/${table}?select=${select}`;
    if (eq) url += `&id=eq.${eq}`;
    const opts = { method, headers: { "Content-Type":"application/json", apikey:SUPABASE_KEY, Authorization:`Bearer ${SUPABASE_KEY}` } };
    if (data) opts.body = JSON.stringify(data);
    const r = await fetch(url, opts);
    if (!r.ok) throw new Error("Supabase "+r.status);
    return method==="DELETE" ? null : await r.json();
  },
  list(t){return this.fetch("GET",t)},
  insert(t,d){return this.fetch("POST",t,{data:d})},
  update(t,id,d){return this.fetch("PATCH",`${t}?id=eq.${id}`,{data:d})},
  remove(t,id){return this.fetch("DELETE",t,{eq:id})},
};

const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const digitsOf=p=>(p||"").replace(/\D/g,"");
const fmtMoney=n=>n?new Intl.NumberFormat("uk-UA").format(n)+" ₴":"—";
const rel=(ts,now)=>{const m=Math.round((now-ts)/60000);if(m<1)return"щойно";if(m<60)return`${m} хв`;const h=Math.floor(m/60);if(h<24)return`${h} год`;const d=Math.floor(h/24);return d===1?"вчора":`${d} дн`;};

const STAGES=[
  {id:"new",label:"Новий",color:"#6E8595"},
  {id:"contacted",label:"Зв'язались",color:"#5A7CA6"},
  {id:"qualified",label:"Кваліфіковано",color:"#B8862B"},
  {id:"proposal",label:"КП надіслано",color:"#8C6239"},
  {id:"negotiation",label:"Переговори",color:"#6E4A9E"},
  {id:"won",label:"Угода",color:"#3E7A4E"},
];
const LOST={id:"lost",label:"Відмова",color:"#B23A22"};
const ALL_ST=[...STAGES,LOST];
const statusOf=id=>ALL_ST.find(s=>s.id===id)||STAGES[0];

const SOURCES=[
  {id:"instagram",label:"Instagram",short:"IG"},
  {id:"facebook",label:"Facebook",short:"FB"},
  {id:"google",label:"Google",short:"GOOGLE"},
  {id:"site",label:"Сайт",short:"WEB"},
  {id:"telegram",label:"Telegram",short:"TG"},
  {id:"call",label:"Дзвінок",short:"CALL"},
  {id:"referral",label:"Рекомендація",short:"REF"},
];
const srcOf=id=>SOURCES.find(s=>s.id===id)||SOURCES[SOURCES.length-1];

const SEGMENTS=[
  {id:"unknown",label:"Не визначено"},
  {id:"horeca",label:"Ресторан / Кафе"},
  {id:"hotel",label:"Готель"},
  {id:"zhek",label:"ЖЕК / ОСББ"},
  {id:"developer",label:"Забудовник"},
  {id:"contractor",label:"Генпідрядник"},
  {id:"architect",label:"Архітектор"},
  {id:"landscape",label:"Ландшафтний дизайнер"},
  {id:"private",label:"Приватний клієнт"},
];
const segLabel=id=>(SEGMENTS.find(s=>s.id===id)||SEGMENTS[0]).label;

function demoLeads(){
  const now=Date.now();
  const mk=o=>({id:uid(),email:"",telegram:"",city:"",campaign:"",owner:"",budget:0,segment:"unknown",updatedAt:now,history:[],...o});
  return [
    mk({name:"Олена Коваль",phone:"+380671234567",source:"instagram",segment:"private",status:"new",createdAt:now-40*60000}),
    mk({name:"Ресторан «Стейкхаус»",phone:"+380985554433",source:"google",segment:"horeca",budget:180000,status:"contacted",createdAt:now-3*3600000}),
    mk({name:"ТОВ «Житлобуд»",phone:"+380503332211",source:"facebook",segment:"developer",budget:620000,status:"proposal",createdAt:now-3*864e5}),
    mk({name:"ОСББ «Затишний двір»",phone:"+380631112233",source:"site",segment:"zhek",budget:95000,status:"qualified",createdAt:now-8*3600000}),
    mk({name:"Готель «Панорама»",phone:"+380671119988",source:"referral",segment:"hotel",budget:340000,status:"negotiation",createdAt:now-2*864e5}),
  ];
}

function App(){
  const [leads,setLeads]=useState([]);
  const [loaded,setLoaded]=useState(false);
  const [q,setQ]=useState("");
  const [statusF,setStatusF]=useState("active");
  const [openId,setOpenId]=useState(null);
  const [adding,setAdding]=useState(false);
  const [toastMsg,setToastMsg]=useState("");
  const [now,setNow]=useState(Date.now());

  const toast=m=>{setToastMsg(m);setTimeout(()=>setToastMsg(""),3000);};
  useEffect(()=>{const t=setInterval(()=>setNow(Date.now()),30000);return()=>clearInterval(t);},[]);
  useEffect(()=>{(async()=>{
    try{const rows=await supabase.list("leads");setLeads(rows||[]);}
    catch(e){console.error(e);}
    setLoaded(true);
  })();},[]);

  const patch=(id,p)=>{
    setLeads(ls=>ls.map(l=>l.id===id?{...l,...p}:l));
    supabase.update("leads",id,p).catch(e=>console.error(e));
  };
  const createLead=async f=>{
    const l={id:uid(),...f,createdAt:Date.now(),updatedAt:Date.now(),status:"new"};
    try{await supabase.insert("leads",l);setLeads(ls=>[l,...ls]);setAdding(false);setOpenId(l.id);toast("Лід додано");}
    catch(e){toast("Помилка збереження");}
  };
  const remove=async id=>{
    try{await supabase.remove("leads",id);setLeads(ls=>ls.filter(l=>l.id!==id));setOpenId(null);toast("Видалено");}
    catch(e){toast("Помилка");}
  };
  const changeStatus=(id,to)=>patch(id,{status:to});

  const listItems=useMemo(()=>leads.filter(l=>
    (q?`${l.name} ${l.phone}`.toLowerCase().includes(q.toLowerCase()):true) &&
    (statusF==="all"?true:statusF==="active"?l.status!=="won"&&l.status!=="lost":l.status===statusF)
  ).sort((a,b)=>b.createdAt-a.createdAt),[leads,q,statusF]);

  const openLead=leads.find(l=>l.id===openId);

  const stats=useMemo(()=>{
    const total=leads.length;
    const today=leads.filter(l=>new Date(l.createdAt).toDateString()===new Date(now).toDateString()).length;
    const active=leads.filter(l=>l.status!=="won"&&l.status!=="lost").length;
    const won=leads.filter(l=>l.status==="won").length;
    const conv=total?Math.round(won/total*100):0;
    return {total,today,active,conv};
  },[leads,now]);

  return (
    <div className="app">
      <aside className="sidebar">
        <div className="brand">
          <div className="brand-mark">AP</div>
          <div className="brand-txt"><b>ADT Print</b><span>CRM Система</span></div>
        </div>
        <nav className="nav">
          <div className="nav-sec">Огляд</div>
          <button className="nav-item on"><span className="ic">☰</span>Ліди<span className="n">{stats.active}</span></button>
          <button className="nav-item"><span className="ic">◧</span>Дашборд</button>
          <button className="nav-item"><span className="ic">▤</span>Звіти</button>
          <div className="nav-sec">Джерела</div>
          {SOURCES.map(s=>(
            <button key={s.id} className="nav-item" onClick={()=>{}}>
              <span className="ic">•</span>{s.label}
            </button>
          ))}
        </nav>
        <div className="sidebar-foot">
          <div className="avatar">AP</div>
          <div className="who"><b>ADT Print</b><span>3D-друк бетону</span></div>
        </div>
      </aside>

      <div className="main">
        <header className="topbar">
          <span className="page-title">Ліди</span>
          <span className="sp"/>
          {leads.length>0 && <input className="search" placeholder="Пошук за ім'ям чи телефоном" value={q} onChange={e=>setQ(e.target.value)}/>}
          <button className="btn gold" onClick={()=>setAdding(true)}>+ Новий лід</button>
        </header>

        <div className="content">
          {!loaded ? (
            <p style={{color:"#9A9A93"}}>Завантаження…</p>
          ) : leads.length===0 ? (
            <div className="empty">
              <h2>Лідів поки немає</h2>
              <p>Додайте першого ліда вручну або завантажте демо-дані</p>
              <div style={{display:"flex",gap:10,justifyContent:"center"}}>
                <button className="btn gold" onClick={()=>setAdding(true)}>Додати лід</button>
                <button className="btn ghost" onClick={()=>{setLeads(demoLeads());toast("Додано демо-ліди");}}>Демо-дані</button>
              </div>
            </div>
          ) : (
            <>
              <div className="stats">
                <div className="stat-card">
                  <div className="lbl">Всього лідів<span className="dot" style={{background:"#6E8595"}}/></div>
                  <div className="val">{stats.total}</div>
                </div>
                <div className="stat-card">
                  <div className="lbl">Сьогодні<span className="dot" style={{background:"#B8862B"}}/></div>
                  <div className="val">{stats.today}</div>
                </div>
                <div className="stat-card">
                  <div className="lbl">В роботі<span className="dot" style={{background:"#5A7CA6"}}/></div>
                  <div className="val">{stats.active}</div>
                </div>
                <div className="stat-card">
                  <div className="lbl">Конверсія<span className="dot" style={{background:"#3E7A4E"}}/></div>
                  <div className="val">{stats.conv}%</div>
                  <div className="sub up">в угоду</div>
                </div>
              </div>

              <div className="filters">
                <button className={`chip ${statusF==="active"?"on":""}`} onClick={()=>setStatusF("active")}>В роботі</button>
                <button className={`chip ${statusF==="all"?"on":""}`} onClick={()=>setStatusF("all")}>Усі {leads.length}</button>
                {ALL_ST.map(s=>(
                  <button key={s.id} className={`chip ${statusF===s.id?"on":""}`} onClick={()=>setStatusF(s.id)}>
                    <span className="d" style={{background:s.color}}/>{s.label}
                  </button>
                ))}
              </div>

              <div className="leads-table">
                <div className="lt-head">
                  <span></span><span>Клієнт</span><span>Тип клієнта</span><span>Статус</span><span>Джерело</span><span style={{textAlign:"right"}}>Оновлено</span>
                </div>
                {listItems.map(l=>{
                  const st=statusOf(l.status);
                  return (
                    <div key={l.id} className="lt-row" onClick={()=>setOpenId(l.id)}>
                      <span className="lt-bar" style={{background:st.color}}/>
                      <div>
                        <div className="lt-name">{l.name||l.phone}</div>
                        <div className="lt-phone">{l.phone}</div>
                      </div>
                      <span className="pill">{segLabel(l.segment)}</span>
                      <span className="pill"><span className="sw" style={{background:st.color}}/>{st.label}</span>
                      <span className="src-badge">{srcOf(l.source).short}</span>
                      <span className="timeago">{rel(l.createdAt,now)}{l.budget?<><br/><b className="budget">{fmtMoney(l.budget)}</b></>:null}</span>
                    </div>
                  );
                })}
              </div>
            </>
          )}
        </div>
      </div>

      {openLead && (
        <div className="overlay" onClick={()=>setOpenId(null)}>
          <aside className="drawer" onClick={e=>e.stopPropagation()}>
            <div className="d-head"><h2>{openLead.name||openLead.phone}</h2><button className="d-close" onClick={()=>setOpenId(null)}>✕</button></div>
            <div className="d-body">
              <div className="sec">
                <h3>Етап угоди</h3>
                <div className="stage-grid">
                  {STAGES.map(s=>(
                    <button key={s.id} className={`stage-btn ${openLead.status===s.id?"on":""}`} onClick={()=>changeStatus(openLead.id,s.id)}>{s.label}</button>
                  ))}
                </div>
                <div className="stage-grid" style={{marginTop:7,gridTemplateColumns:"1fr"}}>
                  <button className={`stage-btn ${openLead.status==="lost"?"on":""}`} onClick={()=>changeStatus(openLead.id,"lost")} style={openLead.status==="lost"?{background:"#B23A22",borderColor:"#B23A22"}:{}}>Відмова</button>
                </div>
              </div>

              <div className="sec">
                <h3>Контактні дані</h3>
                <div className="fld"><span>Ім'я / Назва</span><input value={openLead.name} onChange={e=>patch(openLead.id,{name:e.target.value})}/></div>
                <div className="grid2">
                  <div className="fld"><span>Телефон</span><input value={openLead.phone} onChange={e=>patch(openLead.id,{phone:e.target.value})}/></div>
                  <div className="fld"><span>Email</span><input value={openLead.email||""} onChange={e=>patch(openLead.id,{email:e.target.value})}/></div>
                </div>
              </div>

              <div className="sec">
                <h3>Класифікація</h3>
                <div className="fld">
                  <span>Тип клієнта</span>
                  <select value={openLead.segment} onChange={e=>patch(openLead.id,{segment:e.target.value})}>
                    {SEGMENTS.map(s=><option key={s.id} value={s.id}>{s.label}</option>)}
                  </select>
                </div>
                <div className="fld">
                  <span>Джерело ліда</span>
                  <select value={openLead.source} onChange={e=>patch(openLead.id,{source:e.target.value})}>
                    {SOURCES.map(s=><option key={s.id} value={s.id}>{s.label}</option>)}
                  </select>
                </div>
                <div className="fld"><span>Бюджет, ₴</span><input type="number" value={openLead.budget||0} onChange={e=>patch(openLead.id,{budget:Number(e.target.value)})}/></div>
              </div>

              <button className="link-del" onClick={()=>remove(openLead.id)}>Видалити лід</button>
            </div>
          </aside>
        </div>
      )}

      {adding && (
        <div className="overlay" onClick={()=>setAdding(false)}>
          <aside className="drawer" onClick={e=>e.stopPropagation()}>
            <div className="d-head"><h2>Новий лід</h2><button className="d-close" onClick={()=>setAdding(false)}>✕</button></div>
            <AddForm onSave={createLead}/>
          </aside>
        </div>
      )}

      {leads.length>0 && !adding && !openLead && <button className="fab" onClick={()=>setAdding(true)}>+ Новий лід</button>}
      {toastMsg && <div className="toast">{toastMsg}</div>}
    </div>
  );
}

function AddForm({onSave}){
  const [f,setF]=useState({name:"",phone:"",email:"",source:"instagram",segment:"unknown",budget:0});
  const set=(k,v)=>setF(x=>({...x,[k]:v}));
  const can=f.name.trim()||digitsOf(f.phone).length>=9;
  return (
    <div className="d-body">
      <div className="sec">
        <h3>Контактні дані</h3>
        <div className="fld"><span>Ім'я / Назва</span><input autoFocus value={f.name} onChange={e=>set("name",e.target.value)}/></div>
        <div className="fld"><span>Телефон</span><input type="tel" value={f.phone} onChange={e=>set("phone",e.target.value)}/></div>
        <div className="fld"><span>Email</span><input type="email" value={f.email} onChange={e=>set("email",e.target.value)}/></div>
      </div>
      <div className="sec">
        <h3>Класифікація</h3>
        <div className="fld">
          <span>Тип клієнта</span>
          <select value={f.segment} onChange={e=>set("segment",e.target.value)}>
            {SEGMENTS.map(s=><option key={s.id} value={s.id}>{s.label}</option>)}
          </select>
        </div>
        <div className="fld">
          <span>Джерело ліда</span>
          <select value={f.source} onChange={e=>set("source",e.target.value)}>
            {SOURCES.map(s=><option key={s.id} value={s.id}>{s.label}</option>)}
          </select>
        </div>
        <div className="fld"><span>Бюджет, ₴ (орієнтовно)</span><input type="number" value={f.budget} onChange={e=>set("budget",Number(e.target.value))}/></div>
      </div>
      <button className="btn gold" style={{width:"100%",justifyContent:"center",padding:"13px"}} disabled={!can} onClick={()=>can&&onSave(f)}>Зберегти лід</button>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
