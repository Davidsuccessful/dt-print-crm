<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADT Print — CRM</title>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&family=Unbounded:wght@500;600;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Onest',system-ui,sans-serif;background:#EDEBE6;color:#22262A;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#C7C2B8;border-radius:8px}
::-webkit-scrollbar-track{background:transparent}

.app{display:flex;min-height:100vh}

/* SIDEBAR */
.sidebar{width:248px;flex:none;background:#181B1D;color:#EDEBE6;display:flex;flex-direction:column;padding:22px 14px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:6px 10px 26px}
.brand-mark{width:38px;height:38px;flex:none;display:flex;align-items:center;justify-content:center}
.brand-mark img{width:100%;height:100%;object-fit:contain;display:block}
.brand-txt b{font-family:'Unbounded',sans-serif;font-size:15px;font-weight:600;display:block;letter-spacing:-.01em}
.brand-txt span{font-size:11px;color:#8B8F92;letter-spacing:.03em;text-transform:uppercase}

.nav{display:flex;flex-direction:column;gap:2px;flex:1}
.nav-item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:9px;background:transparent;border:0;color:#B9BCBE;font-size:14px;font-weight:500;cursor:pointer;text-align:left;width:100%}
.nav-item:hover{background:#232629;color:#fff}
.nav-item.on{background:#2A2E31;color:#fff}

.sidebar-foot{padding:12px;border-top:1px solid #2A2E31;margin-top:8px;display:flex;align-items:center;gap:10px}
.avatar{width:34px;height:34px;flex:none;display:flex;align-items:center;justify-content:center}
.avatar img{width:100%;height:100%;object-fit:contain;display:block}

/* MAIN */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{background:#F6F5F2;border-bottom:1px solid #DEDAD1;padding:18px 32px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:10}
.page-title{font-family:'Unbounded',sans-serif;font-weight:600;font-size:19px;letter-spacing:-.01em}
.topbar .sp{flex:1}
.search{width:280px;padding:10px 14px;border:1px solid #DEDAD1;border-radius:9px;background:#fff;font-size:13.5px}
.search:focus{outline:none;border-color:#181B1D}
.btn{border:1px solid #181B1D;background:transparent;color:#181B1D;border-radius:9px;padding:10px 16px;font-weight:600;font-size:13.5px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.btn.gold{background:linear-gradient(135deg,#C9A15E,#B8862B);border-color:transparent;color:#181B1D}
.btn.gold:hover{filter:brightness(1.06)}
.btn:disabled{opacity:.4;cursor:default}

.content{padding:28px 32px 90px;max-width:1280px;width:100%;margin:0 auto}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:28px}
.stat-card{background:#fff;border:1px solid #E4E1D9;border-radius:14px;padding:18px 20px}
.stat-card .lbl{font-size:12px;color:#8B8B84;font-weight:500;margin-bottom:8px}
.stat-card .val{font-family:'Unbounded',sans-serif;font-size:26px;font-weight:600;letter-spacing:-.02em}
.stat-card .sub{font-size:12px;color:#9A9A93;margin-top:4px}

.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;align-items:center}
.chip{border:1px solid #DEDAD1;background:#fff;border-radius:999px;padding:7px 14px;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;font-weight:500;color:#4C4F50}
.chip.on{background:#181B1D;border-color:#181B1D;color:#fff}

.leads-table{background:#fff;border:1px solid #E4E1D9;border-radius:16px;overflow:hidden}
.lt-head{display:grid;grid-template-columns:3px 1.7fr 1.1fr .7fr 1.1fr .8fr;gap:14px;padding:13px 20px;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:#9A9A93;font-weight:600;border-bottom:1px solid #EEECE5;background:#FAF9F6}
.lt-row{display:grid;grid-template-columns:3px 1.7fr 1.1fr .7fr 1.1fr .8fr;gap:14px;align-items:center;padding:15px 20px;border-bottom:1px solid #EEECE5;cursor:pointer;transition:background .12s}
.lt-row:hover{background:#FAF9F6}
.lt-bar{width:3px;height:34px;border-radius:2px}
.lt-name{font-weight:600;font-size:14.5px}
.lt-phone{font-size:12.5px;color:#9A9A93;margin-top:2px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:#5B5F60;font-weight:500}
.src-badge{display:inline-flex;align-items:center;gap:5px;background:#F1EFE9;border-radius:6px;padding:3px 8px;font-size:11.5px;font-weight:600;color:#4C4F50}
.timeago{font-size:12px;color:#9A9A93;text-align:right}

.empty{text-align:center;padding:70px 32px;background:#fff;border-radius:16px;border:1px solid #E4E1D9}
.empty h2{font-family:'Unbounded',sans-serif;font-size:20px;margin-bottom:10px}
.empty p{color:#8B8B84;margin-bottom:22px;font-size:14px}

/* DRAWER */
.overlay{position:fixed;inset:0;background:rgba(24,27,29,.45);display:flex;justify-content:flex-end;z-index:100}
.drawer{width:100%;max-width:520px;height:100%;background:#F6F5F2;overflow-y:auto;animation:sl .22s ease-out}
@keyframes sl{from{transform:translateX(26px);opacity:.5}to{transform:none;opacity:1}}
.d-head{position:sticky;top:0;background:#F6F5F2;border-bottom:1px solid #E4E1D9;padding:20px 26px;display:flex;justify-content:space-between;align-items:center;z-index:2}
.d-head h2{font-family:'Unbounded',sans-serif;font-size:18px;font-weight:600}
.d-close{border:0;background:#fff;width:32px;height:32px;border-radius:8px;cursor:pointer;font-size:16px;color:#5B5F60;border:1px solid #E4E1D9}
.d-body{padding:24px 26px 60px}
.sec{background:#fff;border:1px solid #E4E1D9;border-radius:14px;padding:18px 20px;margin-bottom:16px}
.sec h3{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:#9A9A93;font-weight:700;margin-bottom:14px}

.stage-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.stage-btn{border:1.5px solid #E4E1D9;background:#fff;border-radius:9px;padding:11px 6px;font-size:11.5px;font-weight:600;text-align:center;cursor:pointer;color:#5B5F60}
.stage-btn.on{background:#181B1D;border-color:#181B1D;color:#fff}

.fld{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.fld:last-child{margin-bottom:0}
.fld>span{font-size:12px;color:#8B8B84;font-weight:600}
.fld input,.fld select,.fld textarea{padding:10px 13px;border:1px solid #E4E1D9;border-radius:9px;background:#FAF9F6;font-size:14px;resize:vertical}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:#181B1D;background:#fff}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.link-del{border:0;background:none;color:#B23A22;font-size:13px;font-weight:600;cursor:pointer;padding:0;margin-top:6px}

/* COMMENTS */
.comments-sec{max-height:300px;overflow-y:auto}
.comment{background:#FAF9F6;border-radius:9px;padding:12px;margin-bottom:10px;font-size:13px}
.comment-author{font-weight:600;color:#181B1D;font-size:12px}
.comment-text{color:#5B5F60;margin-top:4px;line-height:1.4}
.comment-time{font-size:11px;color:#9A9A93;margin-top:6px}
.comment-form{display:flex;gap:8px;margin-top:14px}
.comment-form input{flex:1;padding:8px 12px;border:1px solid #E4E1D9;border-radius:8px;font-size:13px}
.comment-form button{padding:8px 14px;background:#181B1D;color:#fff;border:0;border-radius:8px;font-weight:600;font-size:12px;cursor:pointer}

.fab{position:fixed;right:32px;bottom:32px;background:linear-gradient(135deg,#C9A15E,#B8862B);color:#181B1D;border:0;border-radius:14px;padding:15px 22px;font-weight:700;font-size:14.5px;cursor:pointer;box-shadow:0 10px 28px rgba(184,134,43,.35);z-index:50}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#181B1D;color:#fff;padding:12px 20px;border-radius:10px;font-size:14px;z-index:300}

.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#181B1D;padding:20px}
.login-card{background:#F6F5F2;border-radius:18px;padding:38px 34px;width:100%;max-width:380px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.login-brand{display:flex;align-items:center;gap:11px;margin-bottom:26px}
.login-brand .brand-mark{width:44px;height:44px}
.login-brand b{font-family:'Unbounded',sans-serif;font-size:17px;font-weight:600;display:block}
.login-brand span{font-size:11px;color:#8B8B84;letter-spacing:.03em;text-transform:uppercase}
.login-err{background:#FBEAE6;color:#B23A22;border-radius:8px;padding:9px 12px;font-size:12.5px;font-weight:600;margin-bottom:14px}
.created-cell{font-size:12px;color:#9A9A93;line-height:1.5}
.meta-row{display:flex;justify-content:space-between;font-size:12.5px;color:#5B5F60;padding:7px 0;border-bottom:1px solid #F1EFE9}
.meta-row:last-child{border-bottom:0}
.meta-row b{color:#181B1D;font-weight:600}
.logout-btn{border:0;background:#232629;color:#B9BCBE;border-radius:8px;padding:7px 12px;font-size:12px;font-weight:600;cursor:pointer;margin-left:auto}
.logout-btn:hover{background:#2A2E31;color:#fff}

.nav-sec{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:#63676A;padding:16px 12px 6px}
.nav-item .n{margin-left:auto;background:#2F3336;color:#C9C9C4;font-size:11px;font-weight:700;border-radius:20px;padding:1px 7px;min-width:20px;text-align:center}
.nav-item.on .n{background:#C9A15E;color:#181B1D}
.sidebar-foot{align-items:flex-start;gap:11px;padding:14px 12px 6px}
.sidebar-foot .who{min-width:0}
.sidebar-foot .who b{font-family:'Unbounded',sans-serif;font-size:13.5px;font-weight:600;display:block;line-height:1.25;letter-spacing:-.01em}
.sidebar-foot .who span{display:block;font-size:11px;color:#7E8285;line-height:1.4;margin-top:3px}

.period-wrap{position:relative}
.period-btn{border:1px solid #DEDAD1;background:#fff;border-radius:9px;padding:10px 14px;font-size:13.5px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:8px;color:#22262A;white-space:nowrap}
.period-btn:hover{border-color:#181B1D}
.period-btn .cv{color:#9A9A93;font-size:11px}
.period-pop{position:absolute;top:calc(100% + 6px);right:0;background:#fff;border:1px solid #E4E1D9;border-radius:13px;box-shadow:0 14px 40px rgba(24,27,29,.16);padding:8px;z-index:60;min-width:230px}
.period-opt{display:block;width:100%;text-align:left;border:0;background:transparent;border-radius:8px;padding:9px 12px;font-size:13.5px;cursor:pointer;color:#3A3E40}
.period-opt:hover{background:#F6F5F2}
.period-opt.on{background:#181B1D;color:#fff;font-weight:600}
.period-custom{border-top:1px solid #EEECE5;margin-top:6px;padding:12px 12px 8px;display:flex;flex-direction:column;gap:9px}
.period-custom label{font-size:11.5px;color:#8B8B84;font-weight:600;display:flex;flex-direction:column;gap:4px}
.period-custom input{padding:8px 10px;border:1px solid #E4E1D9;border-radius:8px;font-size:13px;background:#FAF9F6}
.period-note{font-size:11.5px;color:#9A9A93;padding:2px 12px 8px}

/* DASHBOARD / REPORTS */
.panel{background:#fff;border:1px solid #E4E1D9;border-radius:16px;padding:22px 24px;margin-bottom:16px}
.panel h3{font-family:'Unbounded',sans-serif;font-size:15px;font-weight:600;margin-bottom:18px}
.bar-row{display:grid;grid-template-columns:150px 1fr 60px;gap:12px;align-items:center;margin-bottom:10px;font-size:13px}
.bar-row:last-child{margin-bottom:0}
.bar-track{background:#F1EFE9;border-radius:6px;height:22px;overflow:hidden}
.bar-fill{height:100%;border-radius:6px;min-width:2px;transition:width .3s}
.bar-val{text-align:right;font-weight:600;font-size:13px}
.bar-lbl{color:#5B5F60;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rep-table{width:100%;border-collapse:collapse;font-size:13px}
.rep-table th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:#9A9A93;font-weight:600;padding:9px 10px;border-bottom:1px solid #EEECE5}
.rep-table td{padding:11px 10px;border-bottom:1px solid #F5F3EE}
.rep-table tr:last-child td{border-bottom:0}
.rep-table td.num{text-align:right;font-weight:600;white-space:nowrap}
.rep-name{font-weight:600;max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rep-empty{color:#9A9A93;font-size:13.5px;padding:8px 0}

@media(max-width:900px){
  .sidebar{display:none}
  .stats{grid-template-columns:repeat(2,1fr)}
  .lt-head{display:none}
  .lt-row{grid-template-columns:3px 1fr;grid-template-areas:"bar main";padding:14px 16px}
  .lt-row>.pill,.lt-row>.src-badge,.lt-row>.timeago,.lt-row>.created-cell{display:none}
  .content{padding:20px 16px 90px}
  .topbar{padding:14px 16px}
}
</style>
</head>

    const c = line[i];
    if (c === '"') {
      if (q && line[i + 1] === '"') { cur += '"'; i++; }
      else q = !q;
    } else if (c === delim && !q) { out.push(cur); cur = ''; }
    else cur += c;
  }
  out.push(cur);
  return out.map(s => s.trim());
};

const HEADER_HINTS = ['created_time', 'phone', 'first_name', 'campaign_name', 'form_id', 'ad_name'];

// Шукає рядок шапки — Facebook додає зверху службовий рядок з назвою вивантаження
const findHeaderRow = (rows) => {
  for (let i = 0; i < Math.min(rows.length, 15); i++) {
    const low = rows[i].map(c => String(c || '').toLowerCase().trim());
    const hits = HEADER_HINTS.filter(h => low.includes(h)).length;
    if (hits >= 2) return i;
  }
  return 0;
};

const rowsToObjects = (rows) => {
  const hi = findHeaderRow(rows);
  const head = rows[hi].map(h => String(h || '').replace(/^\uFEFF/, '').toLowerCase().trim());
  return rows.slice(hi + 1)
    .filter(r => r.some(c => String(c || '').trim()))
    .map(r => {
      const o = {};
      head.forEach((h, i) => { if (h) o[h] = String(r[i] ?? '').trim(); });
      return o;
    });
};

const parseCsv = (text) => {
  const lines = text.split(/\r?\n/).filter(l => l.trim());
  if (!lines.length) return [];
  // роздільник визначаємо по рядку шапки, а не по першому рядку файлу
  const probe = lines.find(l => HEADER_HINTS.filter(h => l.toLowerCase().includes(h)).length >= 2) || lines[0];
  // обираємо той роздільник, що трапляється найчастіше: таб, крапка з комою, кома, вертикальна риска
  const delim = ['\t', ';', ',', '|']
    .map(d => ({ d, n: probe.split(d).length - 1 }))
    .sort((a, b) => b.n - a.n)[0];
  return rowsToObjects(lines.map(l => splitCsvLine(l, delim.n > 0 ? delim.d : ',')));
};

const parseXlsx = (buf) => {
  const wb = XLSX.read(buf, { type: 'array' });
  const sheet = wb.Sheets[wb.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, raw: false, defval: '' });
  return rowsToObjects(rows);
};

const PLATFORM_MAP = { fb: 'facebook', facebook: 'facebook', ig: 'instagram', instagram: 'instagram' };

const rowToLead = (r) => {
  const name = (r.full_name || [r.first_name, r.last_name].filter(Boolean).join(' ')).trim();
  const objType = r["тип_об'єкта"] || r['тип_объекта'] || r['тип_обєкта'] || r.object_type || '';
  const noteParts = [];
  if (r.form_name) noteParts.push('Форма: ' + r.form_name);
  if (objType) noteParts.push("Тип об'єкта: " + objType);
  if (r.lead_status && r.lead_status.toLowerCase() !== 'complete') {
    noteParts.push('Статус форми: ' + r.lead_status);
  }
  return {
    external_id: stripPrefix(r.id) || null,
    name: name || null,
    phone: stripPrefix(r.phone) || null,
    email: r.email || null,
    source: PLATFORM_MAP[(r.platform || '').toLowerCase()] || 'facebook',
    segment: 'unknown',
    status: 'new',
    budget: 0,
    campaign: r.campaign_name || null,
    adset_name: r.adset_name || null,
    ad_name: r.ad_name || null,
    object_type: objType || null,
    note: noteParts.join(' · ') || null,
    created_at: r.created_time && !isNaN(new Date(r.created_time))
      ? new Date(r.created_time).toISOString() : undefined
  };
};

const fmtDay = (d) => new Date(d).toLocaleDateString('uk-UA', { day: '2-digit', month: '2-digit' });
const startOfDay = (d) => { const x = new Date(d); x.setHours(0,0,0,0); return x; };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const startOfWeek = (d) => { const x = startOfDay(d); const w = (x.getDay() + 6) % 7; return addDays(x, -w); };
const startOfMonth = (d) => { const x = startOfDay(d); x.setDate(1); return x; };

const PERIODS = [
  { id: 'all', label: 'Весь період' },
  { id: 'today', label: 'Сьогодні' },
  { id: 'yesterday', label: 'Вчора' },
  { id: 'd7', label: 'Останні 7 днів' },
  { id: 'd14', label: 'Останні 14 днів' },
  { id: 'd28', label: 'Останні 28 днів' },
  { id: 'd30', label: 'Останні 30 днів' },
  { id: 'week', label: 'Цей тиждень' },
  { id: 'lastweek', label: 'Минулий тиждень' },
  { id: 'month', label: 'Цей місяць' },
  { id: 'lastmonth', label: 'Минулий місяць' },
  { id: 'custom', label: 'Свій діапазон' },
];

// повертає [from, to) або null якщо без обмежень
const periodRange = (id, custom) => {
  const today = startOfDay(new Date());
  const tomorrow = addDays(today, 1);
  switch (id) {
    case 'today': return [today, tomorrow];
    case 'yesterday': return [addDays(today, -1), today];
    case 'd7': return [addDays(today, -6), tomorrow];
    case 'd14': return [addDays(today, -13), tomorrow];
    case 'd28': return [addDays(today, -27), tomorrow];
    case 'd30': return [addDays(today, -29), tomorrow];
    case 'week': return [startOfWeek(today), tomorrow];
    case 'lastweek': { const s = addDays(startOfWeek(today), -7); return [s, addDays(s, 7)]; }
    case 'month': return [startOfMonth(today), tomorrow];
    case 'lastmonth': {
      const s = startOfMonth(today); s.setMonth(s.getMonth() - 1);
      const e = startOfMonth(today); return [s, e];
    }
    case 'custom': {
      if (!custom?.from && !custom?.to) return null;
      const f = custom.from ? startOfDay(new Date(custom.from)) : new Date(0);
      const t = custom.to ? addDays(startOfDay(new Date(custom.to)), 1) : addDays(today, 1);
      return [f, t];
    }
    default: return null;
  }
};

const inPeriod = (dateStr, range) => {
  if (!range) return true;
  const d = new Date(dateStr);
  return d >= range[0] && d < range[1];
};

const digitsOf = (phone) => (phone || '').replace(/\D/g, '');
const fmtMoney = (val) => `${(val || 0).toLocaleString('uk-UA')} ₴`;
const rel = (date, now) => {
  if (!date) return '';
  const d = new Date(date);
  const secs = (now - d) / 1000;
  if (secs < 60) return 'щойно';
  if (secs < 3600) return `${Math.floor(secs / 60)}м`;
  if (secs < 86400) return `${Math.floor(secs / 3600)}г`;
  return `${Math.floor(secs / 86400)}д`;
};

function Login({ onOk }) {
  const [u, setU] = useState('');
  const [p, setP] = useState('');
  const [err, setErr] = useState('');

  const submit = () => {
    if (u.trim() === AUTH.user && p === AUTH.pass) {
      localStorage.setItem('adt_auth', JSON.stringify({ ok: 1, at: Date.now() }));
      onOk();
    } else {
      setErr('Невірний логін або пароль');
    }
  };

  return (
    <div className="login-wrap">
      <div className="login-card">
        <div className="login-brand">
          <div className="brand-mark"><img src={LOGO} alt="ADT Print" /></div>
          <div>
            <b>ADT Print</b>
            <span>CRM система</span>
          </div>
        </div>
        {err && <div className="login-err">{err}</div>}
        <div className="fld">
          <span>Логін</span>
          <input autoFocus value={u} onChange={e => { setU(e.target.value); setErr(''); }}
                 onKeyDown={e => e.key === 'Enter' && submit()} />
        </div>
        <div className="fld">
          <span>Пароль</span>
          <input type="password" value={p} onChange={e => { setP(e.target.value); setErr(''); }}
                 onKeyDown={e => e.key === 'Enter' && submit()} />
        </div>
        <button className="btn gold" style={{ width: '100%', justifyContent: 'center', padding: '13px', marginTop: '8px' }}
                onClick={submit}>Увійти</button>
      </div>
    </div>
  );
}

function App() {

    try {
      const raw = localStorage.getItem('adt_auth');
      if (!raw) return false;
      const { ok, at } = JSON.parse(raw);
      const DAYS_30 = 30 * 24 * 60 * 60 * 1000;
      if (ok !== 1 || Date.now() - at > DAYS_30) { localStorage.removeItem('adt_auth'); return false; }
      return true;
    } catch { return false; }
  });
  const [leads, setLeads] = useState([]);
  const [loading, setLoading] = useState(true);
  const [search, setSearch] = useState('');
  const [statusF, setStatusF] = useState('');
  const [openId, setOpenId] = useState(null);
  const [adding, setAdding] = useState(false);
  const [toastMsg, setToastMsg] = useState('');
  const [importing, setImporting] = useState(false);
  const [view, setView] = useState('leads');
  const [period, setPeriod] = useState('all');
  const [custom, setCustom] = useState({ from: '', to: '' });
  const [periodOpen, setPeriodOpen] = useState(false);
  const [srcF, setSrcF] = useState('');
  const [comments, setComments] = useState({});
  const [newComments, setNewComments] = useState({});
  const now = new Date();

  useEffect(() => {
    if (authed) loadLeads();
  }, [authed]);

  const loadLeads = async () => {
    setLoading(true);
    try {
      const res = await fetch(API_URL, { method: 'GET', headers: HEADERS });
      if (res.ok) {
        const data = await res.json();
        setLeads(data);
        // Завантажимо коментарі з localStorage
        const savedComments = JSON.parse(localStorage.getItem('lead_comments') || '{}');
        setComments(savedComments);
      }
    } catch (e) {
      showToast('Помилка завантаження');
    }
    setLoading(false);
  };

  const showToast = (msg) => {
    setToastMsg(msg);
    setTimeout(() => setToastMsg(''), 3000);
  };

  const saveLead = async (lead) => {
    try {
      const res = await fetch(API_URL, {
        method: 'POST',
        headers: HEADERS,
        body: JSON.stringify(lead)
      });
      if (res.ok) {
        const newLead = await res.json();
        setLeads([newLead, ...leads]);
        setAdding(false);
        showToast('Лід додано!');
      }
    } catch (e) {
      showToast('Помилка збереження');
    }
  };

  const updateLead = async (id, changes) => {
    try {
      const res = await fetch(`${API_URL}?id=${id}`, {
        method: 'PATCH',
        headers: HEADERS,
        body: JSON.stringify(changes)
      });
      if (res.ok) {
        const updated = await res.json();
        setLeads(leads.map(l => l.id === id ? updated : l));
        showToast('Оновлено');
      }
    } catch (e) {
      showToast('Помилка оновлення');
    }
  };

  const removeLead = async (id) => {
    if (!confirm('Видалити?')) return;
    try {
      const res = await fetch(`${API_URL}?id=${id}`, { method: 'DELETE', headers: HEADERS });
      if (res.ok) {
        setLeads(leads.filter(l => l.id !== id));
        setOpenId(null);
        showToast('Видалено');
      }
    } catch (e) {
      showToast('Помилка видалення');
    }
  };

  const exportCsv = () => {
    const head = ["Ім'я", 'Телефон', 'Email', 'Статус', 'Тип клієнта', 'Джерело',
                  'Бюджет', 'Кампанія', 'Група оголошень', 'Оголошення', "Тип об'єкта",
                  'Примітка', 'Створено'];
    const rows = leads.map(l => [
      l.name || '', l.phone || '', l.email || '',
      statusOf(l.status).label, segLabel(l.segment), srcOf(l.source).label,
      l.budget || 0, l.campaign || '', l.adset_name || '', l.ad_name || '',
      l.object_type || '', l.note || '', fmtDate(l.created_at)
    ]);
    const csv = '\uFEFF' + [head, ...rows]
      .map(r => r.map(c => '"' + String(c).replace(/"/g, '""') + '"').join(';')).join('\n');
    const a = document.createElement('a');

    a.download = 'adt-leads-' + new Date().toISOString().slice(0, 10) + '.csv';
    a.click();
    showToast('Експортовано ' + leads.length + ' лідів');
  };

  const importCsv = async (file) => {
    if (!file) return;
    setImporting(true);
    try {
      if (/\.numbers$/i.test(file.name)) {
        showToast('Формат .numbers не підтримується. У Numbers: Файл → Експортувати в → CSV');
        setImporting(false); return;
      }
      const isExcel = /\.(xlsx|xls)$/i.test(file.name);
      let rows;
      if (isExcel) {
        rows = parseXlsx(await file.arrayBuffer());
      } else {
        rows = parseCsv(await file.text());
      }

      if (!rows.length) { showToast('У файлі не знайдено рядків з даними'); setImporting(false); return; }

      const cols = Object.keys(rows[0] || {});
      const mapped = rows.map(rowToLead).filter(l => l.phone || l.name);
      if (!mapped.length) {
        showToast('Немає колонок phone / first_name. Знайдено: ' + cols.slice(0, 6).join(', '));
        setImporting(false); return;

      const existing = new Set(leads.map(l => l.external_id).filter(Boolean));
      const fresh = mapped.filter(l => !l.external_id || !existing.has(l.external_id));
      const skipped = mapped.length - fresh.length;

      if (!fresh.length) {
        showToast('Усі ' + mapped.length + ' лідів вже є в системі');
        setImporting(false); return;
      }

      const res = await fetch(API_URL, {
        method: 'POST', headers: HEADERS, body: JSON.stringify(fresh)
      });
      if (!res.ok) throw new Error((await res.text()).slice(0, 160));

      await loadLeads();
      showToast('Імпортовано ' + fresh.length + (skipped ? ', пропущено дублів: ' + skipped : ''));

      showToast('Помилка імпорту: ' + e.message);

    const newComments = { ...comments, [leadId]: updated };
    setComments(newComments);
    localStorage.setItem('lead_comments', JSON.stringify(newComments));
    setNewComments({ ...newComments, [leadId]: '' });
    showToast('Коментар додано');

    return match && (!statusF || l.status === statusF) && (!srcF || l.source === srcF);
  });

  const openLead = leads.find(l => l.id === openId);

  const inWork = scoped.filter(l => !['won', 'qualified', 'lost'].includes(l.status));

    { label: 'Всього лідів', val: scoped.length },

    { label: 'Потенціал', val: fmtMoney(inWork.reduce((sum, l) => sum + (l.budget || 0), 0)) },
  ];

            <b>ADT Print</b>
            <span>CRM СИСТЕМА</span>
          </div>

          <div className="nav-sec">Огляд</div>
          <button className={`nav-item ${view === 'leads' ? 'on' : ''}`} onClick={() => setView('leads')}>

            Звіти
          </button>

            onClick={() => { setSrcF(''); setView('leads'); }}>
            Усі джерела <span className="n">{leads.length}</span>

              </div>
              {listItems.map(l => {
                const st = statusOf(l.status);
                return (
                  <div key={l.id} className="lt-row" onClick={() => setOpenId(l.id)}>
                    <span className="lt-bar" style={{ background: st.color }} />
                    <div>
                      <div className="lt-name">{l.name || l.phone || 'Без імені'}</div>
                      <div className="lt-phone">{l.phone || l.email || '—'}</div>
                    </div>
                    <span className="pill"><span style={{ background: st.color, width: 7, height: 7, borderRadius: '50%' }} />{st.label}</span>
                    <span className="src-badge">{srcOf(l.source).short}</span>
                    <span className="created-cell">{fmtDate(l.created_at)}<br />{rel(l.created_at, now)}</span>
                    <span className="timeago">{l.budget ? <b style={{ fontSize: '13px' }}>{fmtMoney(l.budget)}</b> : '—'}</span>
                  </div>
                );
              })}
            </div>
          )}
          </>}
        </div>

        {openLead && (
          <div className="overlay" onClick={() => setOpenId(null)}>
            <aside className="drawer" onClick={e => e.stopPropagation()}>
              <div className="d-head">
                <h2>{openLead.name || openLead.phone}</h2>
                <button className="d-close" onClick={() => setOpenId(null)}>✕</button>
              </div>
              <div className="d-body">
                <div className="sec">
                  <h3>Етап угоди</h3>
                  <div className="stage-grid">
                    {STAGES.map(s => (
                      <button key={s.id} className={`stage-btn ${openLead.status === s.id ? 'on' : ''}`} onClick={() => updateLead(openLead.id, { status: s.id })}>
                        {s.label}
                      </button>
                    ))}
                  </div>
                  <div className="stage-grid" style={{ marginTop: 7, gridTemplateColumns: '1fr' }}>
                    <button className={`stage-btn ${openLead.status === 'lost' ? 'on' : ''}`} onClick={() => updateLead(openLead.id, { status: 'lost' })} style={openLead.status === 'lost' ? { background: '#B23A22', borderColor: '#B23A22', color: '#fff' } : {}}>
                      Відмова
                    </button>
                  </div>
                </div>

                <div className="sec">
                  <h3>Інформація</h3>
                  <div className="meta-row"><span>Створено</span><b>{fmtDate(openLead.created_at)}</b></div>
                  <div className="meta-row"><span>Тип клієнта</span><b>{segLabel(openLead.segment)}</b></div>
                  <div className="meta-row"><span>Джерело</span><b>{srcOf(openLead.source).label}</b></div>
                </div>

                <div className="sec">
                  <h3>Контактні дані</h3>
                  <div className="fld">
                    <span>Ім'я / Назва</span>
                    <input value={openLead.name} onChange={e => updateLead(openLead.id, { name: e.target.value })} />
                  </div>
                  <div className="grid2">
                    <div className="fld">
                      <span>Телефон</span>
                      <input value={openLead.phone || ''} onChange={e => updateLead(openLead.id, { phone: e.target.value })} />
                    </div>
                    <div className="fld">
                      <span>Email</span>
                      <input value={openLead.email || ''} onChange={e => updateLead(openLead.id, { email: e.target.value })} />
                    </div>
                  </div>
                </div>

                <div className="sec">
                  <h3>Класифікація</h3>
                  <div className="fld">
                    <span>Тип клієнта</span>
                    <select value={openLead.segment} onChange={e => updateLead(openLead.id, { segment: e.target.value })}>
                      {SEGMENTS.map(s => <option key={s.id} value={s.id}>{s.label}</option>)}
                    </select>
                  </div>
                  <div className="fld">
                    <span>Джерело ліда</span>
                    <select value={openLead.source || 'instagram'} onChange={e => updateLead(openLead.id, { source: e.target.value })}>
                      {SOURCES.map(s => <option key={s.id} value={s.id}>{s.label}</option>)}
                    </select>
                  </div>
                  <div className="fld">
                    <span>Бюджет, ₴</span>
                    <input type="number" value={openLead.budget || 0} onChange={e => updateLead(openLead.id, { budget: Number(e.target.value) })} />
                  </div>
                </div>

                {(openLead.campaign || openLead.adset_name || openLead.ad_name || openLead.object_type) && (
                  <div className="sec">
                    <h3>Рекламна кампанія</h3>
                    {openLead.campaign && <div className="meta-row"><span>Кампанія</span><b>{openLead.campaign}</b></div>}
                    {openLead.adset_name && <div className="meta-row"><span>Група оголошень</span><b>{openLead.adset_name}</b></div>}
                    {openLead.ad_name && <div className="meta-row"><span>Оголошення</span><b>{openLead.ad_name}</b></div>}
                    {openLead.object_type && <div className="meta-row"><span>Тип об'єкта</span><b>{openLead.object_type}</b></div>}
                  </div>
                )}

                <div className="sec">
                  <h3>Примітка</h3>
                  <div className="fld">
                    <textarea rows="3" placeholder="Внутрішня примітка по ліду…"
                      defaultValue={openLead.note || ''}
                      onBlur={e => { if (e.target.value !== (openLead.note || '')) updateLead(openLead.id, { note: e.target.value }); }} />
                  </div>
                </div>

                <div className="sec comments-sec">
                  <h3>Коментарі ({leadCommentsList.length})</h3>
                  {leadCommentsList.map((c, i) => (
                    <div key={i} className="comment">
                      <div className="comment-author">{c.author}</div>
                      <div className="comment-text">{c.text}</div>
                      <div className="comment-time">{new Date(c.time).toLocaleString('uk-UA')}</div>
                    </div>
                  ))}
                  <div className="comment-form">
                    <input
                      type="text"
                      placeholder="Додати коментар..."
                      value={newComments[openLead.id] || ''}
                      onChange={e => setNewComments({ ...newComments, [openLead.id]: e.target.value })}
                      onKeyPress={e => e.key === 'Enter' && addComment(openLead.id, e.target.value)}
                    />
                    <button onClick={() => addComment(openLead.id, newComments[openLead.id] || '')}>✓</button>
                  </div>
                </div>

                <button className="link-del" onClick={() => removeLead(openLead.id)}>Видалити лід</button>
              </div>
            </aside>
          </div>
        )}

        {adding && (
          <div className="overlay" onClick={() => setAdding(false)}>
            <aside className="drawer" onClick={e => e.stopPropagation()}>
              <div className="d-head">
                <h2>Новий лід</h2>
                <button className="d-close" onClick={() => setAdding(false)}>✕</button>
              </div>
              <AddForm onSave={saveLead} onCancel={() => setAdding(false)} />
            </aside>
          </div>
        )}

        {view === 'leads' && !adding && !openLead && <button className="fab" onClick={() => setAdding(true)}>+ Новий лід</button>}
        {toastMsg && <div className="toast">{toastMsg}</div>}
      </main>
    </div>
  );
}

function Bars({ items, total, color }) {
  if (!items.length) return <div className="rep-empty">Немає даних</div>;
  const max = Math.max(...items.map(i => i.n), 1);
  return items.map(i => (
    <div key={i.key} className="bar-row">
      <span className="bar-lbl" title={i.label}>{i.label}</span>
      <div className="bar-track">
        <div className="bar-fill" style={{
          width: (i.n / max * 100) + '%',
          background: i.color || color || '#C9A15E'
        }} />
      </div>
      <span className="bar-val">{i.n}{total ? ` · ${Math.round(i.n / total * 100)}%` : ''}</span>
    </div>
  ));
}

function Dashboard({ leads }) {
  const total = leads.length;
  const bySource = SOURCES.map(src => ({
    key: src.id, label: src.label,
    n: leads.filter(l => l.source === src.id).length
  })).filter(x => x.n > 0).sort((a, b) => b.n - a.n);

  const byStage = [...STAGES, LEGACY[1]].map(st => ({
    key: st.id, label: st.label, color: st.color,
    n: leads.filter(l => l.status === st.id).length
  })).filter(x => x.n > 0);

  const bySegment = SEGMENTS.map(sg => ({
    key: sg.id, label: sg.label,
    n: leads.filter(l => (l.segment || 'unknown') === sg.id).length
  })).filter(x => x.n > 0).sort((a, b) => b.n - a.n);

  // останні 14 днів
  const days = [];
  for (let i = 13; i >= 0; i--) {
    const d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - i);
    const next = new Date(d); next.setDate(next.getDate() + 1);
    days.push({
      key: d.toISOString(),
      label: d.toLocaleDateString('uk-UA', { day: '2-digit', month: '2-digit' }),
      n: leads.filter(l => {
        const c = new Date(l.created_at);
        return c >= d && c < next;
      }).length
    });
  }

  const won = leads.filter(l => l.status === 'won' || l.status === 'qualified').length;
  const lost = leads.filter(l => l.status === 'lost').length;
  const closed = won + lost;
  const conv = closed ? Math.round(won / closed * 100) : 0;
  const withBudget = leads.filter(l => l.budget > 0);
  const avg = withBudget.length
    ? Math.round(withBudget.reduce((s, l) => s + l.budget, 0) / withBudget.length) : 0;

  return (
    <div>
      <div className="stats">
        <div className="stat-card"><div className="lbl">Усього лідів</div><div className="val">{total}</div></div>
        <div className="stat-card"><div className="lbl">Кваліфіковані</div><div className="val">{won}</div></div>
        <div className="stat-card"><div className="lbl">Конверсія</div><div className="val">{conv}%</div>
          <div className="sub">{won} з {closed} закритих</div></div>
        <div className="stat-card"><div className="lbl">Середній чек</div><div className="val">{fmtMoney(avg)}</div></div>
      </div>

      <div className="panel">
        <h3>Ліди за останні 14 днів</h3>
        <Bars items={days} />
      </div>

      <div className="panel">
        <h3>За етапами</h3>
        <Bars items={byStage} total={total} />
      </div>

      <div className="panel">
        <h3>За джерелами</h3>
        <Bars items={bySource} total={total} />
      </div>

      <div className="panel">
        <h3>За типом клієнта</h3>
        <Bars items={bySegment} total={total} />
      </div>
    </div>
  );
}

function Reports({ leads }) {
  const group = (field) => {
    const m = new Map();
    leads.forEach(l => {
      const k = l[field] || '— не вказано —';
      if (!m.has(k)) m.set(k, { name: k, n: 0, won: 0, lost: 0, budget: 0 });
      const g = m.get(k);
      g.n++;
      if (l.status === 'won' || l.status === 'qualified') g.won++;
      if (l.status === 'lost') g.lost++;
      g.budget += l.budget || 0;
    });
    return [...m.values()].sort((a, b) => b.n - a.n);
  };

  const Table = ({ rows }) => {
    if (!rows.length) return <div className="rep-empty">Немає даних</div>;
    return (
      <table className="rep-table">
        <thead><tr>
          <th>Назва</th><th style={{ textAlign: 'right' }}>Лідів</th>
          <th style={{ textAlign: 'right' }}>Кваліф.</th>
          <th style={{ textAlign: 'right' }}>Конверсія</th>
          <th style={{ textAlign: 'right' }}>Потенціал</th>
        </tr></thead>
        <tbody>
          {rows.map(r => {
            const closed = r.won + r.lost;
            return (
              <tr key={r.name}>
                <td className="rep-name" title={r.name}>{r.name}</td>
                <td className="num">{r.n}</td>
                <td className="num">{r.won}</td>
                <td className="num">{closed ? Math.round(r.won / closed * 100) + '%' : '—'}</td>
                <td className="num">{r.budget ? fmtMoney(r.budget) : '—'}</td>
              </tr>
            );
          })}
        </tbody>
      </table>
    );
  };

  return (
    <div>
      <div className="panel"><h3>За кампаніями</h3><Table rows={group('campaign')} /></div>
      <div className="panel"><h3>За групами оголошень</h3><Table rows={group('adset_name')} /></div>
      <div className="panel"><h3>За оголошеннями</h3><Table rows={group('ad_name')} /></div>
      <div className="panel"><h3>За типом об'єкта</h3><Table rows={group('object_type')} /></div>
    </div>
  );
}

function AddForm({ onSave, onCancel }) {
  const [f, setF] = useState({ name: '', phone: '', email: '', source: 'instagram', segment: 'unknown', budget: 0, status: 'new' });
  const set = (k, v) => setF(x => ({ ...x, [k]: v }));
  const can = f.name.trim() || digitsOf(f.phone).length >= 9;

  return (
    <div className="d-body">
      <div className="sec">
        <h3>Контактні дані</h3>
        <div className="fld">
          <span>Ім'я / Назва</span>
          <input autoFocus value={f.name} onChange={e => set('name', e.target.value)} />
        </div>
        <div className="fld">
          <span>Телефон</span>
          <input type="tel" value={f.phone} onChange={e => set('phone', e.target.value)} />
        </div>
        <div className="fld">
          <span>Email</span>
          <input type="email" value={f.email} onChange={e => set('email', e.target.value)} />
        </div>
      </div>
      <div className="sec">
        <h3>Класифікація</h3>
        <div className="fld">
          <span>Тип клієнта</span>
          <select value={f.segment} onChange={e => set('segment', e.target.value)}>
            {SEGMENTS.map(s => <option key={s.id} value={s.id}>{s.label}</option>)}
          </select>
        </div>
        <div className="fld">
          <span>Джерело ліда</span>
          <select value={f.source} onChange={e => set('source', e.target.value)}>
            {SOURCES.map(s => <option key={s.id} value={s.id}>{s.label}</option>)}
          </select>
        </div>
        <div className="fld">
          <span>Бюджет, ₴ (орієнтовно)</span>
          <input type="number" value={f.budget} onChange={e => set('budget', Number(e.target.value))} />
        </div>
      </div>
      <button className="btn gold" style={{ width: '100%', justifyContent: 'center', padding: '13px', marginBottom: '10px' }} disabled={!can} onClick={() => can && onSave(f)}>
        Зберегти лід
      </button>
      <button className="btn" style={{ width: '100%', justifyContent: 'center', padding: '13px' }} onClick={onCancel}>
        Скасувати
      </button>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
